# Dependabot y las vulnerabilidades de las dependencias de Vita+.
#
# Solo abre pull requests de SEGURIDAD: cuando una dependencia tiene una
# vulnerabilidad conocida, propone la versión que la corrige. Para eso hay
# que activar en GitHub: Settings > Code security > Dependabot alerts y
# Dependabot security updates.
#
# Las actualizaciones normales de versión están apagadas
# (open-pull-requests-limit: 0): cada una abría su propia rama, llenaban el
# repositorio y algunas eran peligrosas (por ejemplo, subir Java a 24
# cuando el proyecto usa Java 17). Las de seguridad no dependen de ese
# límite. Para revisar a mano qué hay de nuevo, basta subir el límite de un
# ecosistema y esperar a la siguiente revisión semanal.
version: 2

updates:
  # Los 11 servicios del backend (cada uno tiene su propio pom.xml)
  - package-ecosystem: maven
    directories:
      - /backend/acompanante-service
      - /backend/actividad-service
      - /backend/analitica-service
      - /backend/api-gateway
      - /backend/auth-service
      - /backend/donacion-service
      - /backend/mensajeria-service
      - /backend/organizacion-service
      - /backend/persona-mayor-service
      - /backend/salud-service
      - /backend/voluntario-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      backend-menores:
        update-types: [minor, patch]

  # Frontend (Angular, ECharts, Leaflet...)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      frontend-menores:
        update-types: [minor, patch]

  # Imágenes base de los Dockerfiles (Maven, Java, Node y Caddy)
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # Imagen de autoheal en docker-compose.yml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # Acciones de GitHub de .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
