<!-- Indicadores -->
<div class="kpis">
  @for (k of tarjetas(); track k.etiqueta) {
    <app-kpi [etiqueta]="k.etiqueta" [valor]="k.valor" [detalle]="k.detalle" [icono]="k.icono" [tono]="k.tono" />
  }
</div>

<!-- Gráficas; cada una se puede ver también como tabla -->
<div class="graficas">
  <app-grafica-card
    titulo="Rangos de edad"
    descripcion="Cuántas personas mayores hay en cada rango de edad."
    [opciones]="graficaEdad()"
    [tabla]="tablaEdad()"
    [vacio]="datos().personas.length === 0"
    textoVacio="Aún no tienes personas mayores asociadas."
  />

  <app-grafica-card
    titulo="Género"
    descripcion="Distribución por género de las personas asociadas."
    [opciones]="graficaGenero()"
    [tabla]="tablaGenero()"
    [vacio]="datos().personas.length === 0"
    textoVacio="Aún no tienes personas mayores asociadas."
  />

  <app-grafica-card
    titulo="EPS"
    descripcion="Entidades de salud de las personas asociadas."
    [opciones]="graficaEps()"
    [tabla]="tablaEps()"
    [vacio]="datos().personas.length === 0"
    textoVacio="Aún no tienes personas mayores asociadas."
  />

  <app-grafica-card
    titulo="Intereses más comunes"
    descripcion="Los 10 gustos, talentos y hobbies registrados por el mayor número de personas. Sirve para planear actividades que les gusten."
    [opciones]="graficaIntereses()"
    [tabla]="tablaIntereses()"
    [alto]="340"
    [vacio]="datos().intereses.length === 0"
    textoVacio="Ninguna persona asociada ha registrado sus intereses."
  />
</div>
