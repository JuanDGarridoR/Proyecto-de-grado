@if (lector.disponible) {
  <button
    type="button"
    class="lector"
    data-lector-ignorar
    [class.lector--activo]="lector.activo()"
    [class.lector--hablando]="lector.hablando()"
    [attr.aria-pressed]="lector.activo()"
    [attr.aria-label]="lector.activo() ? 'Desactivar lector de voz' : 'Activar lector de voz'"
    [title]="lector.activo() ? 'Lector de voz activado: toca para apagarlo' : 'Activar lector de voz'"
    (click)="lector.alternar()"
  >
    <app-icono [name]="lector.activo() ? 'volume' : 'volume-off'" strokeWidth="2" />
    <!-- "activo" va en su propia línea: en una sola no cabe dentro del círculo -->
    <span class="lector__texto">
      Lector
      @if (lector.activo()) {
        <span class="lector__estado">activo</span>
      }
    </span>
  </button>
}
