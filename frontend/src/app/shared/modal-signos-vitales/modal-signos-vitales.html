<!-- Un clic en el fondo cierra el modal; dentro del modal no. -->
<div class="modal-overlay" (click)="cerrar.emit()">
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="signos-title"
    (click)="$event.stopPropagation()"
  >
    <div class="modal__header">
      <div>
        <span class="eyebrow"> Salud </span>

        <h2 id="signos-title">Últimos signos vitales</h2>
      </div>

      <button type="button" class="modal__close" (click)="cerrar.emit()" aria-label="Cerrar">
        ×
      </button>
    </div>

    <p class="modal__description">
      Registros más recientes de
      <strong>{{ nombre() }}</strong>.
    </p>

    <app-signos-vitales-lista
      [registros]="registros()"
      [cargando]="cargando()"
      [error]="error()"
    />
  </div>
</div>
