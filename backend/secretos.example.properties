# Plantilla de claves del backend para desarrollo local.
#
# 1. Copia este archivo como "secretos.properties" en esta misma carpeta
#    (backend/secretos.properties). Ese archivo NO se sube a git.
# 2. Llena los valores (pídelos a tu compañero por un medio privado).
#
# Todos los servicios lo leen al arrancar (spring.config.import). En el
# servidor no se usa: ahí las mismas claves van en el archivo .env de
# Docker (ver .env.example en la raíz del proyecto).

# Contraseña de la base de datos de Supabase
DB_PASSWORD=

# Secreto con el que se firman las sesiones (JWT). Mínimo 32 caracteres.
JWT_SECRET=

# Clave de Hunter (verificación de correos)
HUNTER_API_KEY=

# Clave de TextBee (envío de SMS)
TEXTBEE_API_KEY=
