spring:
  application:
    name: api-gateway

  # Claves (secreto del JWT): en desarrollo salen de backend/secretos.properties
  # (no se sube a git); en el servidor, de variables de entorno.
  config:
    import: "optional:file:../secretos.properties"

  cloud:
    # Dónde está cada servicio. Las rutas usan lb://<servicio> y el balanceador
    # reparte las peticiones entre sus instancias (round robin). En desarrollo
    # cada servicio tiene una sola instancia en localhost; en el servidor,
    # application-docker.yml agrega las réplicas.
    discovery:
      client:
        simple:
          instances:
            auth-service:
              - uri: ${AUTH_SERVICE_URL:http://localhost:8081}
            mensajeria-service:
              - uri: ${MENSAJERIA_SERVICE_URL:http://localhost:8082}
            salud-service:
              - uri: ${SALUD_SERVICE_URL:http://localhost:8084}
            persona-mayor-service:
              - uri: ${PERSONA_MAYOR_SERVICE_URL:http://localhost:8085}
            acompanante-service:
              - uri: ${ACOMPANANTE_SERVICE_URL:http://localhost:8086}
            voluntario-service:
              - uri: ${VOLUNTARIO_SERVICE_URL:http://localhost:8087}
            organizacion-service:
              - uri: ${ORGANIZACION_SERVICE_URL:http://localhost:8088}
            actividad-service:
              - uri: ${ACTIVIDAD_SERVICE_URL:http://localhost:8089}
            analitica-service:
              - uri: ${ANALITICA_SERVICE_URL:http://localhost:8090}
            donacion-service:
              - uri: ${DONACION_SERVICE_URL:http://localhost:8091}

    # Round robin entre las instancias. Con retry.enabled, cuando el filtro
    # Retry (abajo) repite una petición, el balanceador la manda a una
    # instancia distinta de la que acaba de fallar: si una réplica está caída,
    # el reintento cae en la otra.
    #
    # No se usa el health check activo del balanceador (configurations:
    # health-check): con la lista fija de instancias de arriba no recibe
    # ninguna y deja todas las rutas sin servicio. De las réplicas que no
    # responden se encargan los reintentos y, en el servidor, Docker (las
    # reinicia al fallar su health check; ver docker-compose.yml).
    loadbalancer:
      retry:
        enabled: true

    gateway:
      server:
        webflux:
          # Tiempo máximo para conectarse a un servicio y para que responda.
          # Sin esto, un servicio colgado deja la petición esperando para siempre.
          httpclient:
            connect-timeout: 3000
            response-timeout: 60s

          # Se aplican a todas las rutas, en este orden (el primero envuelve a
          # los demás, así el circuit breaker solo ve el resultado final):
          # 1. CircuitBreaker: uno por ruta (toma el id de la ruta). Si una ruta
          #    falla mucho seguido, deja de llamar al servicio un rato y responde
          #    de inmediato con /fallback/servicio-no-disponible (ver
          #    FallbackController), en vez de acumular peticiones colgadas.
          # 2. Retry de GET: los GET no cambian nada, así que repetirlos es
          #    seguro aunque el servicio alcanzara a recibirlos. Se repiten si
          #    no hubo respuesta a tiempo o si llegó 502/503/504.
          # 3. Retry de cualquier método, solo si no se pudo ni conectar
          #    (conexión rechazada, réplica apagada o reiniciándose): la
          #    petición nunca llegó, así que repetir un POST no duplica nada.
          default-filters:
            - name: CircuitBreaker
              args:
                fallbackUri: forward:/fallback/servicio-no-disponible
                statusCodes:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
            - name: Retry
              args:
                retries: 2
                methods: GET
                series: ""
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                exceptions: java.io.IOException,java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 200ms
                  maxBackoff: 1s
                  factor: 2
                  basedOnPreviousValue: false
            - name: Retry
              args:
                retries: 2
                methods: GET,POST,PUT,DELETE,PATCH
                series: ""
                exceptions: java.net.ConnectException,java.net.UnknownHostException

          # CORS para el frontend: en desarrollo, Angular en localhost:4200; en
          # el servidor, la dirección pública (variable CORS_ORIGINS, separada
          # por comas). Aplica a las rutas de abajo, no a los controladores del
          # gateway (ver EventosController).
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "${CORS_ORIGINS:http://localhost:4200}"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

          # Rutas hacia cada servicio. Gana la primera que coincide, por eso las
          # más específicas van antes que las generales. JwtAuth exige un token
          # válido (ver JwtAuthGatewayFilterFactory).
          routes:

            # Login, registro y cuenta. No lleva JwtAuth porque el login y el
            # registro son públicos; auth-service valida el token por su cuenta
            # en las demás rutas.
            - id: auth-backend
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

            # Solo el envío del código es público. /api/otp/verify no se expone:
            # lo llama auth-service directamente, y si estuviera abierto se
            # podrían adivinar códigos de otros celulares sin pasar por el login.
            - id: mensajeria-otp
              uri: lb://mensajeria-service
              predicates:
                - Path=/api/otp/send

            # Campanita del panel: SMS enviados al usuario autenticado.
            - id: mensajeria-notificaciones
              uri: lb://mensajeria-service
              predicates:
                - Path=/api/notificaciones/**
              filters:
                - JwtAuth

            # Gustos, acompañantes, organizaciones y botón de emergencia
            # de la persona mayor.
            - id: personamayor-service
              uri: lb://persona-mayor-service
              predicates:
                - Path=/api/persona-mayor/acompanantes/**,/api/persona-mayor/organizaciones/**,/api/persona-mayor/emergencia,/api/persona-mayor/*/gustos,/api/gustos/**
              filters:
                - JwtAuth

            # Medicamentos, citas médicas y datos de salud que el acompañante
            # gestiona por una persona mayor (salud-service). Van antes de
            # acompanante-service porque /api/acompanante/** las capturaría.
            - id: acompanante-salud
              uri: lb://salud-service
              predicates:
                - Path=/api/acompanante/personas-mayores/*/medicamentos/**,/api/acompanante/personas-mayores/*/citas-medicas/**,/api/acompanante/personas-mayores/*/condiciones-salud/**
              filters:
                - JwtAuth

            # Perfil de una persona mayor editado por su acompañante
            # (auth-service, dueño de la tabla usuario).
            - id: acompanante-informacion-persona-mayor
              uri: lb://auth-service
              predicates:
                - Path=/api/acompanante/personas-mayores/*/informacion
              filters:
                - JwtAuth

            # Personas mayores a cargo del acompañante y su seguimiento.
            - id: acompanante-service
              uri: lb://acompanante-service
              predicates:
                - Path=/api/acompanante/**
              filters:
                - JwtAuth

            # Acompañantes de una persona mayor, consultados por la organización.
            # Los atiende persona-mayor-service. Va antes de organizacion-service
            # porque /api/organizacion/** la capturaría.
            - id: organizacion-personas-mayores-acompanantes
              uri: lb://persona-mayor-service
              predicates:
                - Path=/api/organizacion/personas-mayores/*/acompanantes
              filters:
                - JwtAuth

            # Signos vitales que registra la organización (salud-service). Va
            # antes de organizacion-service porque /api/organizacion/** la capturaría.
            - id: organizacion-signos-vitales
              uri: lb://salud-service
              predicates:
                - Path=/api/organizacion/signos-vitales/**
              filters:
                - JwtAuth

            # Voluntarios de la organización: la vinculación vive en
            # voluntario-service. Va antes de organizacion-service por la misma razón.
            - id: organizacion-voluntarios
              uri: lb://voluntario-service
              predicates:
                - Path=/api/organizacion/voluntarios,/api/organizacion/voluntarios/**
              filters:
                - JwtAuth

            # Donaciones que recibe la organización y su inventario
            # (donacion-service). Va antes de organizacion-service porque
            # /api/organizacion/** la capturaría.
            - id: organizacion-donaciones
              uri: lb://donacion-service
              predicates:
                - Path=/api/organizacion/donaciones,/api/organizacion/donaciones/**,/api/organizacion/inventario,/api/organizacion/inventario/**
              filters:
                - JwtAuth

            # Información de la organización y sus personas mayores.
            - id: organizacion-service
              uri: lb://organizacion-service
              predicates:
                - Path=/api/organizacion/**
              filters:
                - JwtAuth

            # Analítica de la organización: datos de los reportes y su PDF.
            - id: analitica-service
              uri: lb://analitica-service
              predicates:
                - Path=/api/analitica/**
              filters:
                - JwtAuth

            # Perfil del voluntario y sus vínculos con organizaciones.
            - id: voluntario-service
              uri: lb://voluntario-service
              predicates:
                - Path=/api/voluntario/**
              filters:
                - JwtAuth

            # Medicamentos y recordatorios de la persona mayor.
            - id: salud-backend
              uri: lb://salud-service
              predicates:
                - Path=/api/persona-mayor/medicamentos/**
              filters:
                - JwtAuth

            # Citas médicas de la persona mayor: registrarlas, editarlas,
            # borrarlas y ver las próximas y las pasadas.
            - id: salud-citas-medicas
              uri: lb://salud-service
              predicates:
                - Path=/api/persona-mayor/citas-medicas/**
              filters:
                - JwtAuth

            # Datos de salud de la persona mayor: enfermedades, alergias y
            # discapacidades, y el catálogo del que las elige.
            - id: salud-condiciones-salud
              uri: lb://salud-service
              predicates:
                - Path=/api/persona-mayor/condiciones-salud,/api/persona-mayor/condiciones-salud/**
              filters:
                - JwtAuth

            # Signos vitales de la persona mayor: ver su historial y registrar
            # una medición propia. No se exponen el PUT/DELETE de este
            # controlador, porque los registros no se editan ni se borran.
            # OPTIONS hace falta para el preflight de CORS del navegador: sin
            # él no hay ruta y el gateway responde sin cabeceras CORS.
            - id: salud-signos-vitales-persona-mayor
              uri: lb://salud-service
              predicates:
                - Path=/api/persona-mayor/signos-vitales
                - Method=GET,POST,OPTIONS
              filters:
                - JwtAuth

            # Donaciones que programan los acompañantes y voluntarios.
            - id: donacion-service
              uri: lb://donacion-service
              predicates:
                - Path=/api/donaciones,/api/donaciones/**
              filters:
                - JwtAuth

            # Actividades de las organizaciones y participación en ellas.
            - id: actividad-service
              uri: lb://actividad-service
              predicates:
                - Path=/api/actividades/**
              filters:
                - JwtAuth

# Puerto del gateway; es el único que usa el frontend.
server:
  port: 8080
  shutdown: graceful

# Clave para validar los tokens. Tiene que ser igual a jwt.secret de auth-service.
jwt:
  secret: ${JWT_SECRET}
# Al apagarse (p. ej. al actualizar), termina las peticiones en curso antes de cerrar.
spring.lifecycle.timeout-per-shutdown-phase: 20s

# Health check para Docker (/actuator/health/liveness y /readiness). Solo se
# expone health; en el servidor va en el puerto 9000, que no se publica.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Circuit breaker de cada ruta (el id es el de la ruta). Se abre si en las
# últimas 20 peticiones (mínimo 10) falla la mitad o más; abierto, responde
# de una vez con el fallback durante 20 s y luego deja pasar 3 de prueba.
# timeout-duration: tiempo máximo de una petición antes de contarla como
# fallida; el reporte en PDF de analítica tiene más margen.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    configs:
      default:
        timeout-duration: 20s
    instances:
      analitica-service:
        timeout-duration: 60s
