spring:
  application:
    name: api-gateway

  # Claves (secreto del JWT): en desarrollo salen de backend/secretos.properties
  # (no se sube a git); en el servidor, de variables de entorno.
  config:
    import: "optional:file:../secretos.properties"

  # No se usa descubrimiento de servicios: cada ruta apunta a una URL fija.
  autoconfigure:
    exclude:
      - org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration

  cloud:
    gateway:
      server:
        webflux:
          # CORS para el frontend: en desarrollo, Angular en localhost:4200; en
          # el servidor, la dirección pública (variable CORS_ORIGINS, separada
          # por comas). Aplica a las rutas de abajo, no a los controladores del
          # gateway (ver EventosController).
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "${CORS_ORIGINS:http://localhost:4200}"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

          # Rutas hacia cada servicio. Gana la primera que coincide, por eso las
          # más específicas van antes que las generales. JwtAuth exige un token
          # válido (ver JwtAuthGatewayFilterFactory).
          routes:

            # Login, registro y cuenta. No lleva JwtAuth porque el login y el
            # registro son públicos; auth-service valida el token por su cuenta
            # en las demás rutas.
            - id: auth-backend
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**

            # Solo el envío del código es público. /api/otp/verify no se expone:
            # lo llama auth-service directamente, y si estuviera abierto se
            # podrían adivinar códigos de otros celulares sin pasar por el login.
            - id: messaging-otp
              uri: ${MESSAGING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/otp/send

            # Campanita del panel: SMS enviados al usuario autenticado.
            - id: messaging-notificaciones
              uri: ${MESSAGING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/notificaciones/**
              filters:
                - JwtAuth

            # Gustos, acompañantes, organizaciones y botón de emergencia
            # de la persona mayor.
            - id: personamayor-service
              uri: ${PERSONA_MAYOR_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/persona-mayor/acompanantes/**,/api/persona-mayor/organizaciones/**,/api/persona-mayor/emergencia,/api/persona-mayor/*/gustos,/api/gustos/**
              filters:
                - JwtAuth

            # Medicamentos, citas médicas y datos de salud que el acompañante
            # gestiona por una persona mayor (salud-service). Van antes de
            # acompanante-service porque /api/acompanante/** las capturaría.
            - id: acompanante-salud
              uri: ${SALUD_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/acompanante/personas-mayores/*/medicamentos/**,/api/acompanante/personas-mayores/*/citas-medicas/**,/api/acompanante/personas-mayores/*/condiciones-salud/**
              filters:
                - JwtAuth

            # Perfil de una persona mayor editado por su acompañante
            # (auth-service, dueño de la tabla usuario).
            - id: acompanante-informacion-persona-mayor
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/acompanante/personas-mayores/*/informacion
              filters:
                - JwtAuth

            # Personas mayores a cargo del acompañante y su seguimiento.
            - id: acompanante-service
              uri: ${ACOMPANANTE_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/acompanante/**
              filters:
                - JwtAuth

            # Acompañantes de una persona mayor, consultados por la organización.
            # Los atiende persona-mayor-service. Va antes de organizacion-service
            # porque /api/organizacion/** la capturaría.
            - id: organizacion-personas-mayores-acompanantes
              uri: ${PERSONA_MAYOR_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/organizacion/personas-mayores/*/acompanantes
              filters:
                - JwtAuth

            # Signos vitales que registra la organización (salud-service). Va
            # antes de organizacion-service porque /api/organizacion/** la capturaría.
            - id: organizacion-signos-vitales
              uri: ${SALUD_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/organizacion/signos-vitales/**
              filters:
                - JwtAuth

            # Voluntarios de la organización: la vinculación vive en
            # voluntario-service. Va antes de organizacion-service por la misma razón.
            - id: organizacion-voluntarios
              uri: ${VOLUNTARIO_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/organizacion/voluntarios,/api/organizacion/voluntarios/**
              filters:
                - JwtAuth

            # Información de la organización y sus personas mayores.
            - id: organizacion-service
              uri: ${ORGANIZACION_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/organizacion/**
              filters:
                - JwtAuth

            # Analítica de la organización: datos de los reportes y su PDF.
            - id: analitica-service
              uri: ${ANALITICA_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/analitica/**
              filters:
                - JwtAuth

            # Perfil del voluntario y sus vínculos con organizaciones.
            - id: voluntario-service
              uri: ${VOLUNTARIO_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/voluntario/**
              filters:
                - JwtAuth

            # Medicamentos y recordatorios de la persona mayor.
            - id: salud-backend
              uri: ${SALUD_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/persona-mayor/medicamentos/**
              filters:
                - JwtAuth

            # Citas médicas de la persona mayor: registrarlas, editarlas,
            # borrarlas y ver las próximas y las pasadas.
            - id: salud-citas-medicas
              uri: ${SALUD_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/persona-mayor/citas-medicas/**
              filters:
                - JwtAuth

            # Datos de salud de la persona mayor: enfermedades, alergias y
            # discapacidades, y el catálogo del que las elige.
            - id: salud-condiciones-salud
              uri: ${SALUD_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/persona-mayor/condiciones-salud,/api/persona-mayor/condiciones-salud/**
              filters:
                - JwtAuth

            # Signos vitales de la persona mayor: ver su historial y registrar
            # una medición propia. No se exponen el PUT/DELETE de este
            # controlador, porque los registros no se editan ni se borran.
            # OPTIONS hace falta para el preflight de CORS del navegador: sin
            # él no hay ruta y el gateway responde sin cabeceras CORS.
            - id: salud-signos-vitales-persona-mayor
              uri: ${SALUD_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/persona-mayor/signos-vitales
                - Method=GET,POST,OPTIONS
              filters:
                - JwtAuth

            # Actividades de las organizaciones y participación en ellas.
            - id: actividad-service
              uri: ${ACTIVIDAD_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/actividades/**
              filters:
                - JwtAuth

# Puerto del gateway; es el único que usa el frontend.
server:
  port: 8080

# Clave para validar los tokens. Tiene que ser igual a jwt.secret de auth-service.
jwt:
  secret: ${JWT_SECRET}