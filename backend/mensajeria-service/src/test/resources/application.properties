# Configuración de las pruebas de mensajeria-service. Reemplaza a la de
# src/main/resources: las pruebas usan una base H2 en memoria, nunca se
# conectan a Supabase y no tienen las credenciales de TextBee.
spring.application.name=mensajeria-backend

# Base H2 en memoria en modo PostgreSQL. Hibernate crea las tablas al
# iniciar cada contexto de prueba y las borra al terminar.
spring.datasource.url=jdbc:h2:mem:mensajeria;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Valores de prueba: no son las credenciales reales.
textbee.api-key=clave-de-pruebas
textbee.device-id=dispositivo-de-pruebas
