# Configuración de las pruebas de persona-mayor-service. Reemplaza a la de
# src/main/resources: las pruebas usan una base H2 en memoria y nunca se
# conectan a Supabase ni a messaging-service.
spring.application.name=personamayor-service

# Base H2 en memoria en modo PostgreSQL. Hibernate crea las tablas al
# iniciar cada contexto de prueba y las borra al terminar.
spring.datasource.url=jdbc:h2:mem:personamayor;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Dirección que no responde: ninguna prueba envía SMS de verdad.
messaging.service.url=http://localhost:9
