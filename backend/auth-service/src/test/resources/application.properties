# Configuración de las pruebas de auth-service. Reemplaza a la de
# src/main/resources: las pruebas usan una base H2 en memoria y nunca se
# conectan a Supabase.
spring.application.name=auth-backend

# Base H2 en memoria en modo PostgreSQL. Hibernate crea las tablas al
# iniciar cada contexto de prueba y las borra al terminar.
spring.datasource.url=jdbc:h2:mem:auth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Valores de prueba: no son las claves reales.
jwt.secret=clave_de_pruebas_de_vita_mas_con_al_menos_32_bytes
jwt.expiration=3600000
messaging.service.url=http://localhost:9
hunter.api-key=clave-de-pruebas
